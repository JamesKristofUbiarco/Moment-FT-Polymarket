[project]
name = "moment-ft-polymarket"
version = "0.1.0"
description = "Auditable full-coverage Polymarket features and MOMENT LoRA"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "duckdb>=1.4",
    "huggingface-hub==2.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "momentfm",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "peft==0.21.2",
    "polars>=2.1.0",
    "psutil>=7.2.2",
    "pyarrow==26.0.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers==5.22.2",
]

[tool.uv.sources]
momentfm = { git = "https://github.com/moment-timeseries-foundation-model/moment.git", rev = "38f7310ad594100747ca2a8357e9c7ca7d323e0e" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_mvp"]
